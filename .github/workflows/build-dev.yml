name: Build Dev Modules
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Should build?
        id: should_build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On the scheduled trigger, only build when there's something new to use:
          #   - if `dev.Piko=<tag>` is set in the 'binaries' release body,
          #     build when that pin has changed since the last dev build.
          #   - otherwise, build when crimera/piko has a newer pre-release than
          #     the one we last built against. The unprefixed `Piko=<tag>` is
          #     intentionally ignored here: it's the stable-channel pin and
          #     would shadow the dev auto-detect if we let it through.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BODY=$(gh release view binaries --json body -q '.body' 2>/dev/null || true)
          # Strip '//' comments anywhere on a line, and a leading '#' (which
          # GitHub renders as a markdown heading). Inline '#' inside values
          # like '12.11.0-release#0' must survive.
          BODY=$(printf '%s\n' "$BODY" | awk '
            { sub(/\/\/.*$/, "") }
            { sub(/^[[:space:]]*#.*$/, "") }
            { sub(/^[[:space:]]+/, ""); sub(/[[:space:]]+$/, "") }
            { if (length($0)) print }
          ')
          PINNED=$(printf '%s\n' "$BODY" | grep -m1 -oE '^dev\.Piko=[^[:space:]]*' | cut -d= -f2- || true)
          LAST_BUILT=$(gh release view dev --json body -q '.body' 2>/dev/null | grep -m1 -oE 'crimera/piko@[^ ]+' | cut -d@ -f2 || echo "")
          if [ -n "$PINNED" ]; then
            if [ "$PINNED" = "$LAST_BUILT" ]; then
              echo "pinned to crimera/piko@${PINNED} (unchanged), skipping"
              echo "SHOULD_BUILD=0" >> "$GITHUB_OUTPUT"
            else
              echo "pinned to crimera/piko@${PINNED} (was ${LAST_BUILT:-none})"
              echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
            fi
          else
            LATEST_DEV=$(gh api "repos/crimera/piko/releases" -q '.[0].tag_name' 2>/dev/null || echo "")
            if [ -n "$LATEST_DEV" ] && [ "$LATEST_DEV" = "$LAST_BUILT" ]; then
              echo "no new crimera/piko pre-release, skipping"
              echo "SHOULD_BUILD=0" >> "$GITHUB_OUTPUT"
            else
              echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build modules/APKs (dev/pre-release patches)
        if: ${{ steps.should_build.outputs.SHOULD_BUILD == 1 }}
        run: ./build.sh config-dev.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          NEXT_VER_CODE: ${{ github.run_number }}

      - name: Get output
        if: ${{ steps.should_build.outputs.SHOULD_BUILD == 1 }}
        id: get_output
        run: |
          # The actual patches tag used for the build. On the dev channel only
          # an explicit `dev.Piko=...` is honored; if it isn't set we resolve
          # to the latest pre-release from crimera/piko. The unprefixed
          # `Piko=...` is the stable-channel pin and is ignored here.
          BODY=$(gh release view binaries --json body -q '.body' 2>/dev/null || true)
          # Strip '//' and leading '#' comments so commented-out Piko= lines
          # don't pin. Inline '#' inside values is kept.
          BODY=$(printf '%s\n' "$BODY" | awk '
            { sub(/\/\/.*$/, "") }
            { sub(/^[[:space:]]*#.*$/, "") }
            { sub(/^[[:space:]]+/, ""); sub(/[[:space:]]+$/, "") }
            { if (length($0)) print }
          ')
          PIKO_TAG=$(printf '%s\n' "$BODY" | grep -m1 -oE '^dev\.Piko=[^[:space:]]*' | cut -d= -f2- || true)
          if [ -z "$PIKO_TAG" ]; then
            PIKO_TAG=$(gh api "repos/crimera/piko/releases" -q '.[0].tag_name' 2>/dev/null || echo "unknown")
          fi
          echo "PIKO_DEV_TAG=$PIKO_TAG" >> "$GITHUB_OUTPUT"
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          {
            echo "> ⚠️ Pre-release build against \`crimera/piko@${PIKO_TAG}\`. May be unstable, use at your own risk."
            echo
            cat build.md
          } >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dev release
        if: ${{ steps.should_build.outputs.SHOULD_BUILD == 1 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
        run: |
          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev --title "Dev build (pre-release)" --notes "$BODY" --prerelease
            gh release upload dev ./build/* --clobber
          else
            gh release create dev ./build/* --title "Dev build (pre-release)" --notes "$BODY" --prerelease
          fi

      - name: Publish dev update JSONs
        if: ${{ steps.should_build.outputs.SHOULD_BUILD == 1 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          mkdir -p dev
          get_update_json() {
            echo "{
            \"version\": \"$1\",
            \"versionCode\": ${{ github.run_number }},
            \"zipUrl\": \"$2\",
            \"changelog\": \"https://github.com/$GITHUB_REPOSITORY/releases/tag/dev\"
          }"
          }
          cd build || { echo "build folder not found"; exit 1; }
          for OUTPUT in *module*.zip; do
            [ "$OUTPUT" = "*module*.zip" ] && continue
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            if ! UPDATE_JSON=$(echo "$ZIP_S" | grep updateJson); then continue; fi
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep version=)
            VER="${VER##*=}"
            DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/dev/${OUTPUT}"
            get_update_json "$VER" "$DLURL" >"../dev/${UPDATE_JSON}"
          done
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dev/
          if ! git diff --cached --quiet; then
            git commit -m "Bump dev version ${{ github.run_number }}"
            git push origin HEAD:update
          else
            echo "no changes!"
          fi
